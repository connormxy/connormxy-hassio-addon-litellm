name: connormxy's LiteLLM Proxy
version: "1.0.7"
slug: litellm_proxy
description: "LiteLLM Proxy - Universal LLM API Gateway for Home Assistant"
url: "https://github.com/BerriAI/litellm"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
map:
  - type: addon_config
    read_only: false
    path: /config/addons_config/litellm/
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: ssl
ports:
  4000/tcp: 4000
ports_description:
  4000/tcp: "LiteLLM Proxy API port"
options:
  config_file: "config.yaml"
  log_level: "INFO"
  master_key: ""
schema:
  config_file: "str"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)?"
  master_key: "str?"